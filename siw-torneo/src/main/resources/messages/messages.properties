# =========================================================================
NotNull.partita.dataOra=La data e l'ora della partita sono obbligatorie.
NotBlank.partita.luogo=Il luogo della partita è obbligatorio.
Size.partita.luogo=Il luogo deve avere tra 2 e 200 caratteri.
Min.partita.goalsHome=I gol della squadra in casa non possono essere negativi.
Min.partita.goalsAway=I gol della squadra in trasferta non possono essere negativi.

# =========================================================================
