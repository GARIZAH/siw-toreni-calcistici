# =========================================================================
# MESSAGGI DI VALIDAZIONE - SQUADRA
# =========================================================================
NotBlank.squadra.nome=Il nome della squadra è obbligatorio.
Size.squadra.nome=Il nome della squadra deve avere tra 2 e 100 caratteri.
NotNull.squadra.annoDiFondazione=L'anno di fondazione è obbligatorio.
Min.squadra.annoDiFondazione=L'anno di fondazione non può essere precedente al {value}.
NotBlank.squadra.citta=La città è obbligatoria.
Size.squadra.citta=Il nome della città deve avere tra 2 e 100 caratteri.

# =========================================================================
# MESSAGGI DI VALIDAZIONE - TORNEO
# =========================================================================
NotBlank.torneo.nome=Il nome del torneo è obbligatorio.
Size.torneo.nome=Il nome del torneo deve avere tra 2 e 100 caratteri.
NotNull.torneo.anno=L'anno del torneo è obbligatorio.
Min.torneo.anno=L'anno inserito non è valido (minimo {value}).
Max.torneo.anno=L'anno inserito non è valido (massimo {value}).
Size.torneo.descrizione=La descrizione non può superare i 1000 caratteri.

# =========================================================================
