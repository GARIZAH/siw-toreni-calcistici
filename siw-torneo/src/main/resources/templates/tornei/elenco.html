<!DOCTYPE html>
<html>
	<head>
		<title> Elenco Tornei</title>
		<style>
				        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f7f9fa; color: #333; }
				        h1 { color: #2c3e50; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
				        .torneo-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
				        .torneo-card { background: white; border: 1px solid #e1e8ed; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
				        
				        /* Stile per i bottoni di gestione admin  */
				        .admin-actions { float: right; display: flex; gap: 5px; }
				        .btn-admin-action { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; cursor: pointer; text-decoration: none; border: none; color: white; font-weight: bold;}
				        .btn-edit { background-color: #f39c12; }
				        .btn-edit:hover { background-color: #d35400; }
				        .btn-delete { background-color: #e74c3c; }
				        .btn-delete:hover { background-color: #c0392b; }

				        /*titolo  */
				        .torneo-titolo { margin-top: 10px; font-size: 1.4em; }
				        .torneo-titolo a { color: #2980b9; text-decoration: none; transition: color 0.2s; }
				        .torneo-titolo a:hover { color: #1a5276; text-decoration: underline; }
				        
				        .info-item { margin: 8px 0; font-size: 0.95em; }
				        .info-label { font-weight: bold; color: #7f8c8d; }
				        .link-box { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; display: flex; flex-wrap: wrap; gap: 10px; }
				        .btn { display: inline-block; padding: 6px 12px; background-color: #34495e; color: white; text-decoration: none; border-radius: 4px; font-size: 0.85em; transition: background 0.2s; border: none; cursor: pointer; }
				        .btn:hover { background-color: #2c3e50; }
				        .btn-classifica { background-color: #27ae60; }
				        .btn-classifica:hover { background-color: #219653; }
				        .back-link { display: inline-block; margin-top: 20px; color: #7f8c8d; text-decoration: none; }
				        .back-link:hover { color: #333; }
				    </style>
	</head>
	<body>
		<div sec:authorize="hasAuthority('ADMIN')">
					<strong>⚙️ Aggiungi Torneo:</strong>
					<a th:href="@{/admin/tornei/new}">✍️ AGGIUNGI torneo</a>
			</div>
		
		<h1>🏆 Tornei Disponibili</h1>

		    <div th:if="${#lists.isEmpty(tornei)}">
		        <p>Al momento non ci sono tornei disponibili nel sistema.</p>
		    </div>

		    <div class="torneo-container" th:if="${!#lists.isEmpty(tornei)}">
		        
		        <div class="torneo-card" th:each="torneo : ${tornei}">
		        
		        	<div class="admin-actions" sec:authorize="hasAuthority('ADMIN')">
		        		<a class="btn-admin-action btn-edit" th:href="@{/admin/tornei/{id}/modifica(id=${torneo.id})}">✍️ Modifica</a>
		        		
		        		<form th:action="@{/admin/tornei/{id}/delete(id=${torneo.id})}" method="POST" style="display:inline;">
							<button type="submit" class="btn-admin-action btn-delete">🗑️ Elimina</button>
						</form>
		        	</div>
		        	
		        	<h2 class="torneo-titolo">
		            	<a th:href="@{/tornei/{id}(id=${torneo.id})}" th:text="${torneo.nome}">Nome Torneo</a>
		            </h2>
		            	
					<div class="info-item">
						                <span class="info-label">Anno:</span> 
						                <span th:text="${torneo.anno}">2026</span>
						            </div>

		            <div class="link-box">
		                <a class="btn" th:href="@{'/tornei/' + ${torneo.id} + '/calendario'}">📅 Calendario</a>
		                <a class="btn btn-classifica" th:href="@{'/tornei/' + ${torneo.id} + '/classifica'}">📊 Classifica</a>
		            </div>
		            
		        </div>
		        
		    </div>
			<a href="/" class="back-link">Torna alla home</a>
	</body>
</html>
