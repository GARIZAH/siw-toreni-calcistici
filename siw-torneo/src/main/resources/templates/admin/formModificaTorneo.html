<!DOCTYPE html>
<html>
<head>
    <title>Modifica Torneo</title>
	<style>
		
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			color: #333;
			line-height: 1.5;
			max-width: 600px;
			margin: 40px auto;
			padding: 0 20px;
			background-color: #f8f9fa;
		}

		h1 {
			color: #222;
			border-bottom: 2px solid #e9ecef;
			padding-bottom: 10px;
			margin-bottom: 25px;
		}

		/* Struttura Campi Form */
		form div {
			display: flex;
			flex-direction: column;
			gap: 6px;
		}

		label {
			font-weight: 500;
			color: #444;
		}

		/* Input di tipo testo, numerici e textarea */
		input[type="text"], input[type="number"], textarea {
			padding: 10px 12px;
			border: 1px solid #ccc;
			border-radius: 4px;
			font-size: 1rem;
			color: #333;
			background-color: #fff;
			font-family: inherit; 
		}

		input:focus, textarea:focus {
			border-color: #0066cc;
			outline: none;
		}

		
		textarea {
			resize: vertical;
		}

		/* Bottone di salvataggio modifiche */
		button {
			background-color: #2b8a3e;
			color: white;
			border: none;
			padding: 12px 20px;
			border-radius: 4px;
			font-size: 1rem;
			font-weight: bold;
			cursor: pointer;
			align-self: flex-start;
			margin-top: 5px;
		}

		button:hover {
			background-color: #237032;
		}

		/* Link di annullamento in fondo */
		a {
			color: #666;
			text-decoration: none;
			font-size: 0.95rem;
		}

		a:hover {
			color: #333;
			text-decoration: underline;
		}
	</style>
</head>
<body>

	<h1>Modifica i dati del torneo</h1>

	<form th:action="@{/admin/tornei/{id}/modifica(id=${torneo.id})}" th:object="${torneo}" method="POST">

		<div th:if="${#fields.hasGlobalErrors()}">
			<p th:each="err : ${#fields.globalErrors()}" th:text="${err}" style="color: red;"></p>
		</div>

		<div>
			<label>Nome Torneo:</label>
			<input type="text" th:field="*{nome}" required />
			<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color: red;"></span>
		</div>

		<br />

		<div>
			<label>Anno Edizione:</label>
			<input type="number" th:field="*{anno}" min="2000" max="2100" required />
			<span th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}" style="color: red;"></span>
		</div>

		<br />

		<div>
			<label>Descrizione:</label>
			<textarea th:field="*{descrizione}" rows="4" cols="50" placeholder="Inserisci una descrizione..."></textarea>
			<span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" style="color: red;"></span>
		</div>

		<br />

		<div>
			<button type="submit">Salva Modifiche</button>
		</div>

	</form>

	<br />
	<a th:href="@{/tornei/{id}(id=${torneo.id})}">Annulla e torna indietro</a>

</body>
</html>
