<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Nuovo Torneo</title>
	<style>
		/* Reset e Font di sistema coerenti */
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			color: #333;
			line-height: 1.5;
			max-width: 600px; /* Ottimo per form leggermente più complessi */
			margin: 40px auto;
			padding: 0 20px;
			background-color: #f8f9fa;
		}

		h1 {
			color: #222;
			border-bottom: 2px solid #e9ecef;
			padding-bottom: 10px;
			margin-bottom: 25px;
		}

		/* Struttura Campi Form */
		form div {
			display: flex;
			flex-direction: column;
			gap: 6px;
		}

		label {
			font-weight: 500;
			color: #444;
		}

		/* Input di tipo testo, numerici e textarea */
		input[type="text"], input[type="number"], textarea {
			padding: 10px 12px;
			border: 1px solid #ccc;
			border-radius: 4px;
			font-size: 1rem;
			color: #333;
			background-color: #fff;
			font-family: inherit; /* Mantiene lo stesso font del body */
		}

		input:focus, textarea:focus {
			border-color: #0066cc;
			outline: none;
		}

		/* Dimensione minima per la descrizione */
		textarea {
			min-height: 100px;
			resize: vertical; /* Permette all'utente di allungarla solo in verticale */
		}

		/* Bottone di salvataggio */
		button {
			background-color: #2b8a3e; /* Un bel verde scuro professionale per il "Salva" */
			color: white;
			border: none;
			padding: 12px 20px;
			border-radius: 4px;
			font-size: 1rem;
			font-weight: bold;
			cursor: pointer;
			align-self: flex-start; /* Evita che il bottone diventi largo quanto tutta la pagina */
			margin-top: 5px;
		}

		button:hover {
			background-color: #237032;
		}

		/* Link di annullamento in fondo */
		a {
			color: #666;
			text-decoration: none;
			font-size: 0.95rem;
		}

		a:hover {
			color: #333;
			text-decoration: underline;
		}
	</style>
</head>
<body>

	<h1>Crea un nuovo Torneo</h1>

	<form th:action="@{/admin/tornei/new}" th:object="${torneo}" method="POST">
		
		<div th:if="${#fields.hasGlobalErrors()}">
			<p th:each="err : ${#fields.globalErrors()}" th:text="${err}" style="color: red;"></p>
		</div>

		<div>
			<label>Nome Torneo:</label>
			<input type="text" th:field="*{nome}" placeholder="Es: Torneo Estivo, Champions League..." />
			<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color: red;"></span>
		</div>
		
		<br/>

		<div>
			<label>Anno di svolgimento:</label>
			<input type="number" th:field="*{anno}" placeholder="Es: 2026" />
			<span th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}" style="color: red;"></span>
		</div>
		
		<br/>

		<div>
			<label>Descrizione:</label>
			<textarea th:field="*{descrizione}" placeholder="Breve descrizione del torneo..."></textarea>
			<span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" style="color: red;"></span>
		</div>
		
		<br/>
		
		<div>
			<button type="submit">Salva Torneo</button>
		</div>

	</form>
	
	<br/>
	<a th:href="@{/tornei}">Annulla e torna indietro</a>

</body>
</html>
