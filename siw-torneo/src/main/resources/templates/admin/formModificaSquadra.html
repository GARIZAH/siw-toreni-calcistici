<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Modifica Squadra</title>
    <style>
       
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #2d3748;
            max-width: 480px;
            margin: 50px auto;
            padding: 0 20px;
            background-color: #f4f7f6;
        }

        /* Titolo*/
        h1 {
            font-size: 1.5rem;
            color: #1a202c;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 30px;
            font-weight: 700;
        }

        
        form {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        /* Incolonnamento perfetto label + input */
        form div {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #4a5568;
        }

      
        input[type="text"], input[type="number"] {
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            font-family: inherit;
            color: #2d3748;
        }

        input:focus {
            border-color: #3182ce;
            outline: none;
        }

        /* Pulsante primario azzurro a tutta larghezza */
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.15s ease;
        }

        button:hover {
            background-color: #2b6cb0;
        }

        /* Link di annullamento  */
        p a {
            display: inline-block;
            margin-top: 15px;
            color: #718096;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
        }

        p a:hover {
            color: #2d3748;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Modifica Dati della Squadra</h1>
    
    <form th:action="@{/admin/tornei/{tId}/squadre/{sId}/edit(tId=${torneoId}, sId=${squadra.id})}" th:object="${squadra}" method="POST">
        
        <input type="hidden" th:field="*{id}" />

        <div>
            <label>Nome Squadra:</label>
            <input type="text" th:field="*{nome}" required />
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color:red;"></span>
        </div>
        
        <div>
            <label>Città:</label>
            <input type="text" th:field="*{citta}" required />
            <span th:if="${#fields.hasErrors('citta')}" th:errors="*{citta}" style="color:red;"></span>
        </div>
        
        <div>
            <label>Anno di Fondazione:</label>
            <input type="number" th:field="*{annoDiFondazione}" required />
            <span th:if="${#fields.hasErrors('annoDiFondazione')}" th:errors="*{annoDiFondazione}" style="color:red;"></span>
        </div>
        
        <br />
        <button type="submit">Salva Modifiche</button>
    </form>
    
    <p><a th:href="@{/tornei/{tId}/squadre/{sId}(tId=${torneoId}, sId=${squadra.id})}">Annulla modifiche</a></p>

</body>
</html>
