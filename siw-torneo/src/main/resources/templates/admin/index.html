<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 30px; background-color: #f0f2f5; color: #333; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; border-radius: 8px; padding: 25px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
        .card h2 { margin-top: 0; font-size: 1.1em; color: #2c3e50; }
        .card .icon { font-size: 2.5em; margin-bottom: 10px; }
        .card a { display: inline-block; margin-top: 12px; padding: 8px 18px; background-color: #2980b9; color: white;
                  text-decoration: none; border-radius: 5px; font-size: 0.9em; }
        .card a:hover { background-color: #1f6fa8; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .logout-link { color: #e74c3c; text-decoration: none; font-size: 0.9em; }
        .logout-link:hover { text-decoration: underline; }
        .back-link { color: #7f8c8d; text-decoration: none; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <h1>⚙️ Dashboard Amministratore</h1>
            <p class="subtitle">Gestisci tornei, squadre, giocatori e partite</p>
        </div>
        <div>
            <a class="back-link" href="/tornei">🌐 Vai al sito pubblico</a>
            &nbsp;|&nbsp;
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" style="background:none;border:none;cursor:pointer;color:#e74c3c;font-size:0.9em;padding:0;text-decoration:underline;">
                    🔓 Logout
                </button>
            </form>
        </div>
    </div>

    <div class="grid">

        <!-- TORNEI -->
        <div class="card">
            <div class="icon">🏆</div>
            <h2>Tornei</h2>
            <p>Crea e modifica i tornei</p>
            <a href="/tornei">Vedi elenco</a>
            <br>
            <a href="/admin/tornei/new" style="margin-top:8px; background-color:#27ae60;">+ Nuovo Torneo</a>
        </div>

        <!-- SQUADRE -->
        <div class="card">
            <div class="icon">🛡️</div>
            <h2>Squadre</h2>
            <p>Inserisci e modifica le squadre</p>
            <a href="/admin/squadre/new">+ Nuova Squadra</a>
        </div>

        <!-- PARTITE -->
        <div class="card">
            <div class="icon">⚽</div>
            <h2>Partite</h2>
            <p>Registra partite e inserisci i risultati</p>
            <a href="/tornei">Seleziona torneo</a>
        </div>

    </div>

</body>
</html>
