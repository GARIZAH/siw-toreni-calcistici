<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nuovo Giocatore</title>
    <style>
        /* Layout pulito, moderno e centrato */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #2d3748;
            max-width: 480px;
            margin: 50px auto;
            padding: 0 20px;
            background-color: #f4f7f6;
        }

        /* Titolo con linea inferiore discreta */
        h1 {
            font-size: 1.5rem;
            color: #1a202c;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* Card bianca minimale che pulisce il form */
        form {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        /* Incolonnamento perfetto label + input */
        form div {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #4a5568;
        }

        /* Input moderni facili da cliccare */
        input[type="text"], input[type="date"], input[type="number"], select {
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            font-family: inherit;
            color: #2d3748;
        }

        input:focus, select:focus {
            border-color: #3182ce;
            outline: none;
        }

        /* Pulsante primario azzurro a tutta larghezza */
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.15s ease;
        }

        button:hover {
            background-color: #2b6cb0;
        }

        /* Link di annullamento coordinato sotto la card */
        p a {
            display: inline-block;
            margin-top: 15px;
            color: #718096;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
        }

        p a:hover {
            color: #2d3748;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Tessera Nuovo Giocatore per la squadra: <span th:text="${squadra.nome}">Nome Squadra</span></h1>
    
    <form th:action="@{'/admin/squadre/' + ${squadra.id} + '/giocatori/new'}" th:object="${giocatore}" method="POST">
        
        <div>
            <label>Nome:</label>
            <input type="text" th:field="*{nome}" required />
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color:red;"></span>
        </div>
        
        <div>
            <label>Cognome:</label>
            <input type="text" th:field="*{cognome}" required />
            <span th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}" style="color:red;"></span>
        </div>
        
        <div>
            <label>Data di Nascita:</label>
            <input type="date" th:field="*{dataDiNascita}" required />
            <span th:if="${#fields.hasErrors('dataDiNascita')}" th:errors="*{dataDiNascita}" style="color:red;"></span>
        </div>
        
        <div>
            <label>Altezza (in metri, es 1.85):</label>
            <input type="number" step="0.01" th:field="*{altezza}" required />
            <span th:if="${#fields.hasErrors('altezza')}" th:errors="*{altezza}" style="color:red;"></span>
        </div>
        
        <div>
            <label>Ruolo:</label>
            <select th:field="*{ruolo}" required>
                <option value="">-- Seleziona Ruolo --</option>
                <option th:each="r : ${ruoli}" th:value="${r}" th:text="${r}"></option>
            </select>
            <span th:if="${#fields.hasErrors('ruolo')}" th:errors="*{ruolo}" style="color:red;"></span>
        </div>
        
        <br />
        <button type="submit">Aggiungi Giocatore</button>
    </form>
    
    <p><a th:href="@{'/tornei/'+ ${torneo.id} + '/squadre/' + ${squadra.id}}">Annulla e torna alla squadra</a></p>
					
</body>
</html>
