<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nuova Squadra</title>
    <style>
      
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #2d3748;
            max-width: 480px;
            margin: 50px auto;
            padding: 0 20px;
            background-color: #f4f7f6;
        }

        /* Titolo della pagina */
        h1 {
            font-size: 1.5rem;
            color: #1a202c;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* Card bianca che racchiude il form */
        form {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        /* Struttura verticale per i gruppi label + input */
        form div {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #4a5568;
        }

        /* Input di testo e numerici */
        input[type="text"], input[type="number"] {
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            font-family: inherit;
            color: #2d3748;
        }

        input:focus {
            border-color: #3182ce;
            outline: none;
        }

        /* Pulsante di invio a tutta larghezza */
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.15s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2b6cb0;
        }

        /* Link di annullamento  */
        a {
            display: inline-block;
            color: #718096;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            margin-top: 5px;
        }

        a:hover {
            color: #2d3748;
            text-decoration: underline;
        }

        /* Messaggi di errore rossi e allineati */
        span[style*="color: red"], p[style*="color: red"] {
            color: #e53e3e !important;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 2px;
        }
        
        /* Contenitore errori globali */
        form div[th\:if] {
            margin-bottom: 15px;
            background-color: #fff5f5;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #fed7d7;
        }
        form div[th\:if] p {
            margin: 4px 0;
        }
    </style>
</head>
<body>

	<h1>Crea una nuova squadra per il torneo</h1>
	    
	<form th:action="@{/admin/squadre/{torneoId}/new(torneoId=${torneoId})}" th:object="${squadra}" method="POST">
	        <div th:if="${#fields.hasGlobalErrors()}">
	            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" style="color: red;"></p>
	        </div>

	        <div>
	            <label>Nome della Squadra:</label>
	            <input type="text" th:field="*{nome}" placeholder="Inserisci il nome..." />
	            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color: red;"></span>
	        </div>
	        
	        <br/>

	        <div>
	            <label>Anno di Fondazione:</label>
	            <input type="number" th:field="*{annoDiFondazione}" placeholder="Es. 2024" />
	            <span th:if="${#fields.hasErrors('annoDiFondazione')}" th:errors="*{annoDiFondazione}" style="color: red;"></span>
	        </div>
	        
	        <br/>

	        <div>
	            <label>Città di provenienza:</label>
	            <input type="text" th:field="*{citta}" placeholder="Inserisci la città..." />
	            <span th:if="${#fields.hasErrors('citta')}" th:errors="*{citta}" style="color: red;"></span>
	        </div>
	        
	        <br/>

	        <div>
	            <button type="submit">Salva e Iscrivi la Squadra</button>
	        </div>

	    </form>
	    
	    <br/>
	    <a th:href="@{/tornei/{id}(id=${torneoId})}">Annulla e torna al torneo</a>

</body>
</html>
