<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Modifica Giocatore</title>
    <style>
        /* Sfondo morbido e larghezza calibrata */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #2d3748;
            max-width: 450px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f7fafc;
        }

        h1 {
            font-size: 1.5rem;
            color: #1a202c;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        /* Incolonnameto perfetto dei blocchi label + input */
        form div {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #4a5568;
        }

        /* Input moderni */
        input[type="text"], input[type="date"], input[type="number"], select {
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
            background: #fff;
            font-family: inherit;
        }

        input:focus, select:focus {
            border-color: #3182ce;
            outline: none;
        }

        /* Bottone primario azzurro/blu */
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.15s;
        }

        button:hover {
            background-color: #2b6cb0;
        }

        /* Link di annullamento coordinato */
        p a {
            display: inline-block;
            margin-top: 10px;
            color: #718096;
            text-decoration: none;
            font-size: 0.95rem;
        }

        p a:hover {
            color: #2d3748;
            text-decoration: underline;
        }

        /* Messaggi di errore rossi */
        .error-message {
            color: #e53e3e;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <h1>Modifica Giocatore della squadra: <span th:text="${squadra.nome}">Nome Squadra</span></h1>
    
    <form th:action="@{'/admin/giocatori/' + ${giocatore.id} + '/edit'}" th:object="${giocatore}" method="POST">
        <div>
            <label>Nome:</label>
            <input type="text" th:field="*{nome}" required />
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error-message"></span>
        </div>
        
        <div>
            <label>Cognome:</label>
            <input type="text" th:field="*{cognome}" required />
            <span th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}" class="error-message"></span>
        </div>
        
        <div>
            <label>Data di nascita:</label>
            <input type="date" th:field="*{dataDiNascita}" required />
            <span th:if="${#fields.hasErrors('dataDiNascita')}" th:errors="*{dataDiNascita}" class="error-message"></span>
        </div>
        
        <div>
            <label>Altezza:</label>
            <input type="number" step="0.01" th:field="*{altezza}" required />
            <span th:if="${#fields.hasErrors('altezza')}" th:errors="*{altezza}" class="error-message"></span>
        </div>
        
        <div>
            <label>Ruolo:</label>
            <select th:field="*{ruolo}" required>
                <option th:each="r : ${ruoli}" th:value="${r}" th:text="${r}"></option>
            </select>
            <span th:if="${#fields.hasErrors('ruolo')}" th:errors="*{ruolo}" class="error-message"></span>
        </div>
        
        <br />
        <button type="submit">Salva Modifiche</button>
    </form>
    
    <p><a th:href="@{'/squadre/' + ${squadra.id}}">Annulla modifiche</a></p>
</body>
</html>
