
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Modifica Giocatore</title>
</head>
<body>
    <h1>Modifica Giocatore della squadra: <span th:text="${squadra.nome}">Nome Squadra</span></h1>
    
    <form th:action="@{'/admin/giocatori/' + ${giocatore.id} + '/edit'}" th:object="${giocatore}" method="POST">
        <div>
            <label>Nome:</label>
            <input type="text" th:field="*{nome}" required />
        </div>
        
        <div>
            <label>Cognome:</label>
            <input type="text" th:field="*{cognome}" required />
        </div>
        
        <div>
            <label>Data di nascita:</label>
            <input type="date" th:field="*{dataDiNascita}" required />
        </div>
        
        <div>
            <label>Altezza:</label>
            <input type="number" step="0.01" th:field="*{altezza}" required />
        </div>
        
        <div>
            <label>Ruolo:</label>
            <select th:field="*{ruolo}" required>
                <option th:each="r : ${ruoli}" th:value="${r}" th:text="${r}"></option>
            </select>
        </div>
        
        <br />
        <button type="submit">Salva Modifiche</button>
    </form>
    
    <p><a th:href="@{'/squadre/' + ${squadra.id}}">Annulla modifiche</a></p>
</body>
</html>
