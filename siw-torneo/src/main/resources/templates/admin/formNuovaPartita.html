<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nuova Partita</title>
    <style>
       
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #2d3748;
            max-width: 520px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f4f7f6;
        }

        /* Titolo della pagina con linea */
        h1 {
            font-size: 1.5rem;
            color: #1a202c;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 25px;
            font-weight: 700;
        }

   
        form {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        /* Incolonnamento standard dei blocchi del form */
        form div {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Selettore per la riga dei Gol  */
        form div.goals-row {
            flex-direction: row;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        form div.goals-row input {
            width: 70px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #4a5568;
        }

        /* Input di testo, select, date e numeri */
        input[type="text"], input[type="number"], input[type="datetime-local"], select {
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            font-family: inherit;
            color: #2d3748;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: #3182ce;
            outline: none;
        }

        /* Pulsante primario azzurro a tutta larghezza */
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.15s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2b6cb0;
        }

        /* Link di annullamento  */
        a {
            display: inline-block;
            color: #718096;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            margin-top: 5px;
        }

        a:hover {
            color: #2d3748;
            text-decoration: underline;
        }

        /* Gestione degli errori sia nativi (style inline) che del blocco superiore */
        span[style*="color: red"], p[style*="color: red"], div[style*="color: red"] {
            color: #e53e3e !important;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 2px;
        }

        /* Box dell'errore di logica incrociata delle squadre (es: stessa squadra casa/fuori) */
        div[th\:if*="erroreSquadre"] {
            background-color: #fff5f5 !important;
            border: 1px solid #fed7d7 !important;
            padding: 12px 16px !important;
            border-radius: 8px !important;
            margin-bottom: 20px !important;
        }
    </style>
</head>
<body>
	<h1>Organizza una nuova partita per il torneo: <span th:text="${torneo.nome}">Nome Torneo</span></h1>
	
	<div th:if="${erroreSquadre}" style="background-color: #ffdde0; border: 1px solid red; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
	    <p th:text="${erroreSquadre}" style="color: red; font-weight: bold; margin: 0;"></p>
	</div>
	
	<form th:action="@{/admin/tornei/{tId}/partite/new(tId=${torneo.id})}" th:object="${partita}" method="POST">

		<div th:if="${#fields.hasGlobalErrors()}">
			<p th:each="err : ${#fields.globalErrors()}" th:text="${err}" style="color: red"></p>
		</div>

		<div>
			<label>Squadra in Casa:</label>
			<select name="squadraHome" required>
				<option value="">-- Seleziona Squadra Casa --</option>
				<option th:each="squadra : ${torneo.squadre}" th:value="${squadra.id}" th:text="${squadra.nome}">
				</option>
			</select>
		</div>

		<br />

		<div>
			<label>Squadra Ospite:</label>
			<select name="squadraAway" required>
				<option value="">-- Seleziona Squadra Fuori --</option>
				<option th:each="squadra : ${torneo.squadre}" th:value="${squadra.id}" th:text="${squadra.nome}">
				</option>
			</select>
		</div>

		<br />
		
		<div>
			<label>Arbitro della partita:</label>
			<select name="arbitro">
				<option value="">-- Nessun Arbitro / Seleziona in seguito --</option>
				<option th:each="arb : ${arbitri}" th:value="${arb.id}" th:text="${arb.nome} + ' ' + ${arb.cognome}">
				</option>
			</select>
		</div>

		<br />
		
		<div class="goals-row">
			<label>Gol Squadra Casa:</label>
			<input type="number" th:field="*{goalsHome}" min="0" placeholder="0" />
			<span th:if="${#fields.hasErrors('goalsHome')}" th:errors="*{goalsHome}" style="color: red;"></span>
			
			<label style="margin-left: 20px;">Gol Squadra Ospite:</label>
			<input type="number" th:field="*{goalsAway}" min="0" placeholder="0" />
			<span th:if="${#fields.hasErrors('goalsAway')}" th:errors="*{goalsAway}" style="color: red;"></span>
		</div>

		<br />

		<div>
			<label>Data e Ora della partita:</label>
			<input type="datetime-local" th:field="*{dataOra}" required />
			<span th:if="${#fields.hasErrors('dataOra')}" th:errors="*{dataOra}" style="color: red;"></span>
		</div>	

		<br />

		<div>
			<label>Luogo / Stadio:</label>
			<input type="text" th:field="*{luogo}" placeholder="Es: Campo Roma, Stadio Olimpico..." required />
			<span th:if="${#fields.hasErrors('luogo')}" th:errors="*{luogo}" style="color: red;"></span>
		</div>

		<br />

		<div>
			<button type="submit">Inserisci Partita nel Calendario</button>
		</div>

	</form>

	<br />
	<a th:href="@{/tornei/{id}/calendario(id=${torneo.id})}">Annulla e torna al calendario</a>
	
</body>
</html>
