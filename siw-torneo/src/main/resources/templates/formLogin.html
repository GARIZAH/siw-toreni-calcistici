<!DOCTYPE html>
<html>

<head>
	<title>Login</title>
	<style>
		/* Reset e Font di sistema coerenti */
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			color: #333;
			line-height: 1.5;
			max-width: 400px; /* Perfetto per una scheda di login */
			margin: 60px auto;
			padding: 0 20px;
			background-color: #f8f9fa;
		}

		h1 {
			color: #222;
			border-bottom: 2px solid #e9ecef;
			padding-bottom: 10px;
			margin-bottom: 25px;
		}

		/* Struttura Campi Login */
		form div {
			margin-bottom: 16px;
			display: flex;
			flex-direction: column;
			gap: 5px;
		}

		/* Input generici (sia text che password) */
		input[type="text"], input[type="password"] {
			padding: 8px 12px;
			border: 1px solid #ccc;
			border-radius: 4px;
			font-size: 1rem;
			color: #333;
			background-color: #fff;
		}

		input[type="text"]:focus, input[type="password"]:focus {
			border-color: #0066cc;
			outline: none;
		}

		/* Bottone Accedi */
		button {
			background-color: #0066cc;
			color: white;
			border: none;
			padding: 10px 15px;
			border-radius: 4px;
			font-size: 1rem;
			font-weight: bold;
			cursor: pointer;
			margin-top: 10px;
		}

		button:hover {
			background-color: #0052a3;
		}

		/* Link di registrazione in fondo */
		p {
			margin-top: 25px;
			font-size: 0.95rem;
			color: #666;
			border-top: 1px solid #e9ecef;
			padding-top: 15px;
		}

		a {
			color: #0066cc;
			text-decoration: none;
			font-weight: 500;
		}

		a:hover {
			text-decoration: underline;
		}
	</style>
</head>

<body>
	<h1>Accesso</h1>
	<form th:action="@{/login}" method="post">
		<div>
			Username: <input type="text" name="username">
		</div>
		<div>
			Password: <input type="password" name="password">
		</div>
		<div>
			<button type="submit">Accedi</button>
		</div>
	</form>
	<p> Non sei iscritto?
		<a th:href="@{/register}">Registrati</a>
	</p>
</body>

</html>
