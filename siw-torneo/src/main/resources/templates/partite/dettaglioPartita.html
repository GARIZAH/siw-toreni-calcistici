<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dettaglio Partita</title>
    <style>
    
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #2d3748;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f4f7f6;
        }

        /* Intestazione Match */
        h1 {
            font-size: 1.8rem;
            color: #1a202c;
            text-align: center;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        /* Info Luogo e Risultato */
        p {
            font-size: 1.05rem;
            line-height: 1.6;
        }

        body > p:nth-of-type(1), body > p:nth-of-type(2) {
            background: #ffffff;
            padding: 10px 20px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-weight: 500;
        }

        /* Sezioni Titoli Commenti */
        h3 {
            font-size: 1.3rem;
            color: #2d3748;
            margin-top: 40px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        h4 {
            font-size: 1.1rem;
            color: #2d3748;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        /* Box singolo commento */
        div th\:each {
            /* Mantiene compatibilità di rendering nativo */
        }
        
        div[th\:each] {
            display: block;
        }

        /* Stile per i blocchi di testo dei commenti esistenti */
        div > p {
            background: #ffffff;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        /* Form di Modifica In-linea del commento */
        form[style*="display:inline"] input[type="text"] {
            padding: 6px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.95rem;
            width: 60%;
            margin-right: 5px;
        }

        form[style*="display:inline"] button {
            padding: 6px 12px;
            font-size: 0.85rem;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Link d'azione (Modifica / Annulla) */
        a {
            color: #4a5568;
            text-decoration: none;
            font-size: 0.85rem;
            margin-left: 8px;
            font-weight: 500;
        }

        a:hover {
            color: #2d3748;
            text-decoration: underline;
        }

        /* Form di inserimento Nuovo Commento (in basso) */
        textarea {
            width: 100%;
            height: 80px;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
            background: #fff;
        }

        textarea:focus {
            border-color: #3182ce;
            outline: none;
        }

        /* Bottone Invia Commento principale */
        button[type="submit"]:not(form[style*="display:inline"] button) {
            background-color: #2d3748;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s ease;
        }

        button[type="submit"]:not(form[style*="display:inline"] button):hover {
            background-color: #1a202c;
        }
    </style>
</head>
<body>
	<h1 th:text="${partita.squadraHome.nome} + ' VS ' + ${partita.squadraAway.nome}"></h1>
	<p th:text="'Luogo: ' + ${partita.luogo}"></p>
	<p th:text="'Risultato: ' + ${partita.goalsHome} + ' - ' + ${partita.goalsAway}"></p>
	
	<h3>Commenti degli utenti</h3>

	<p th:if="${#lists.isEmpty(partita.commenti)}">Non ci sono ancora commenti per questa partita.</p>

	<div th:each="commento : ${partita.commenti}">
			<p>
				<strong th:text="${commento.utente.credentials.username}">Nome</strong>:
				
				<span th:unless="${idCommentoInModifica != null and idCommentoInModifica.equals(commento.id)}" 
				      th:text="${commento.testo}">Testo del commento</span>
				
				<form th:if="${idCommentoInModifica != null and idCommentoInModifica.equals(commento.id)}"
				      th:action="@{/registrato/commenti/edit/{id}(id=${commento.id})}" method="post" style="display:inline;">
					<input type="text" name="testo" th:value="${commento.testo}" required />
					<button type="submit">Salva</button>
					<a th:href="@{/partite/{id}(id=${partita.id})}">Annulla</a>
				</form>
				
				<span th:if="${utenteLoggato != null and utenteLoggato.id.equals(commento.utente.id) and (idCommentoInModifica == null or !idCommentoInModifica.equals(commento.id))}">
					<a th:href="@{/partite/{pId}(pId=${partita.id}, editCommentoId=${commento.id})}">Modifica</a>
				</span>
			</p>
		</div>

	<br>
	<h4>Aggiungi un commento:</h4>
	<form th:action="@{/registrato/partite/{partitaId}/commenti(partitaId=${partita.id})}" method="post">
		<textarea name="testo" placeholder="Scrivi qui il tuo commento..." required></textarea>
		<br>
		<button type="submit">Invia Commento</button>
	</form>
	<a th:href="@{/tornei/{id}/calendario(id=${partita.torneo.id})}">🔙 Torna al calendario</a>
</body>
</html>
