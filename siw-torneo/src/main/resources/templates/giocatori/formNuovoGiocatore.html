<!DOCTYPE html>
<html>

<head>
	<title>Nuovo Giocatore</title>
</head>

<body>
	<h1>Aggiungi Giocatore alla squadra: <span th:text="${squadra.nome}">Nome Squadra</span></h1>
	<form th:action="/admin/squadre/{id}/giocatori/new(id=${squadra.id})" th:object="${giocatore}" method="POST">
		<div>
			<label>Nome:</label>
			<input type="text" th:field="*{nome}" required />
		</div>
		<div>
			<label>Cognome:</label>
			<input type="text" th:field="*{cognome}" required />
		</div>
		<div>
			<label>Data di nascita:
				<input type="date" th:field="*{dataDiNascita}" required>
		</div>
		<div>
					<label>Altezza:</label>
					<input type="number" step="0.01" th:field="*{altezza}" required />
				</div>
		<div>
			<label>Ruolo:
				<select th:field="*{ruolo}" required>
					<option value="">Seleziona Ruolo</option>
					<option th:each="ruolo : ${ruoli}" th:value="${ruolo}" th:text="${ruolo}">
					</option>
				</select>
			</label><br />
			
		</div>
		<button type="submit">Salva Giocatore</button>
	</form>
	<p><a th:href="@{'/squadre/' + ${squadra.id}}">Annulla</a></p>
</body>

</html>
