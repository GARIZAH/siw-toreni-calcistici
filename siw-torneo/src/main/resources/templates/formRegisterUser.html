<!DOCTYPE html>
<html>

<head>
	<title>Registrazione</title>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			color: #333;
			line-height: 1.5;
			max-width: 500px;
			margin: 40px auto;
			padding: 0 20px;
			background-color: #f8f9fa;
		}
		h1 {
			color: #222;
			border-bottom: 2px solid #e9ecef;
			padding-bottom: 10px;
			margin-bottom: 25px;
		}
		form div {
			margin-bottom: 16px;
			display: flex;
			flex-direction: column;
			gap: 5px;
		}
		input[type="text"] {
			padding: 8px 12px;
			border: 1px solid #ccc;
			border-radius: 4px;
			font-size: 1rem;
			color: #333;
			background-color: #fff;
		}
		input[type="text"]:focus {
			border-color: #0066cc;
			outline: none;
		}
		button {
			background-color: #0066cc;
			color: white;
			border: none;
			padding: 10px 15px;
			border-radius: 4px;
			font-size: 1rem;
			font-weight: bold;
			cursor: pointer;
			margin-top: 10px;
		}
		button:hover {
			background-color: #0052a3;
		}
		span[th\:if] {
			color: #df2222;
			font-size: 0.85rem;
			margin-top: 2px;
			font-weight: 500;
		}
	</style>
</head>

<body>
	<h1>Registra qui:</h1>
	<form th:action="@{/register}" th:object="${credentials}" method="post">
		
		<div>
			nome:<input type="text" th:field="*{utente.nome}">
			<span th:if="${#fields.hasErrors('utente.nome')}" th:errors="*{utente.nome}"></span>
		</div>
		<div>
			cognome:<input type="text" th:field="*{utente.cognome}">
			<span th:if="${#fields.hasErrors('utente.cognome')}" th:errors="*{utente.cognome}"></span>
		</div>

		<div>
			email:<input type="text" th:field="*{utente.email}">
			<span th:if="${#fields.hasErrors('utente.email')}" th:errors="*{utente.email}"></span>
		</div>
		<div>
			Username:<input type="text" th:field="*{username}">
			<span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
		</div>
		<div>
			Password:<input type="text" th:field="*{password}">
			<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
		</div>
		<div>
				<button type="submit">Registrati</button>
			</div>
	</form>
	
</body>

</html>
